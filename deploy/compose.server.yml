services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionops}
      POSTGRES_USER: ${POSTGRES_USER:-visionops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - visionops-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${VISIONOPS_IMAGE:-ghcr.io/saddadnabbil/visionops:main}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-visionops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-visionops}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INGEST_API_KEY: ${INGEST_API_KEY:?set INGEST_API_KEY in .env}
    ports:
      - "127.0.0.1:${VISIONOPS_PORT:-18081}:8080"
    volumes:
      # Licensed demo media is deployed to the host separately and intentionally
      # excluded from Git/source images.
      - ../web/assets/demo:/web/assets/demo:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  visionops-postgres:
